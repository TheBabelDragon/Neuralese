name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install tensorgate || true
      - name: Pytest
        run: pytest -q
      - name: Demo synthetic experiment
        run: |
          neuralese run synthetic --seed 42 --out artifacts/ci_run
          test -f artifacts/ci_run/manifest.json
