name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Neuralese
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install TensorGate (optional, from GitHub)
        run: |
          pip install "git+https://github.com/TheBabelDragon/TensorGate.git@main" || echo "TensorGate install skipped"

      - name: Pytest
        run: pytest -q --tb=short

      - name: Demo synthetic experiment
        run: |
          neuralese run synthetic --seed 42 --out artifacts/ci_run
          test -f artifacts/ci_run/manifest.json
          test -f artifacts/ci_run/summary.md
          python -c "import json; m=json.load(open('artifacts/ci_run/manifest.json')); assert m['aggregates']['direct_answer']['accuracy']==1.0"
